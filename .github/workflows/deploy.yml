name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kiew-301/arkwallet:latest
            ghcr.io/kiew-301/arkwallet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/opt/arkwallet"
            REPO_URL="https://github.com/KIew-301/ArkWallet.git"

            echo "=== Deploy started at $(date) ==="

            # Login to ghcr.io
            echo "[1/5] Logging in to ghcr.io..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Clone or pull
            if [ -d "$APP_DIR" ]; then
              cd $APP_DIR
              echo "[2/5] Pulling latest code..."
              git fetch origin
              git reset --hard origin/main
            else
              echo "[2/5] Cloning repository..."
              git clone $REPO_URL $APP_DIR
              cd $APP_DIR
            fi

            # Create .env from GitHub Secrets if not exists
            if [ ! -f "$APP_DIR/.env" ]; then
              cat > "$APP_DIR/.env" << 'ENVEOF'
            POSTGRES_DB=arkwallet
            POSTGRES_USER=arkwallet
            POSTGRES_PASSWORD=arkwallet_secure_pass_2024
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            METRICS_API_KEY=${{ secrets.METRICS_API_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_ADMIN_ID=${{ secrets.TELEGRAM_ADMIN_ID }}
            TELEGRAM_ADMIN_ID_ADDITION=${{ secrets.TELEGRAM_ADMIN_ID_ADDITION }}
            TELEGRAM_ADMIN_ID_ADDITION_THIRD=${{ secrets.TELEGRAM_ADMIN_ID_ADDITION_THIRD }}
            RABBITMQ_USER=arkwallet
            RABBITMQ_PASSWORD=rabbit_secure_pass_2024
            ENVEOF
              echo "[!] Created .env from GitHub Secrets"
            fi

            # Update METRICS_API_KEY in existing .env
            if grep -q '^METRICS_API_KEY=' "$APP_DIR/.env"; then
              sed -i "s|^METRICS_API_KEY=.*|METRICS_API_KEY=${{ secrets.METRICS_API_KEY }}|" "$APP_DIR/.env"
            else
              echo "METRICS_API_KEY=${{ secrets.METRICS_API_KEY }}" >> "$APP_DIR/.env"
            fi

            # Render prometheus.yml with the metrics API key
            sed -i "s|change-me-metrics-api-key|${{ secrets.METRICS_API_KEY }}|g" "$APP_DIR/prometheus.yml"

            # Setup nginx, SSL, htpasswd (idempotent — only changes when needed)
            echo "[3/5] Ensuring nginx setup..."
            bash "$APP_DIR/scripts/ensure-nginx.sh" "$APP_DIR"

            # Pull new image and restart
            echo "[4/5] Pulling image and restarting at $(date)..."
            docker compose pull app
            docker compose up -d --remove-orphans
            echo "[4/5] Containers restarted at $(date)"

            # Clean up old images
            echo "[5/5] Pruning old images..."
            docker image prune -f

            echo "=== Deploy complete at $(date) ==="
            echo "App: https://arkwallet.ru"
            echo "Swagger: https://arkwallet.ru/swagger"
