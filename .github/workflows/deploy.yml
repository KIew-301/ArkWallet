name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            APP_DIR="/opt/arkwallet"
            REPO_URL="https://github.com/KIew-301/ArkWallet.git"

            # Clone or pull
            if [ -d "$APP_DIR" ]; then
              cd $APP_DIR
              git fetch origin
              git reset --hard origin/main
            else
              git clone $REPO_URL $APP_DIR
              cd $APP_DIR
            fi

            # Create .env from GitHub Secrets if not exists
            if [ ! -f "$APP_DIR/.env" ]; then
              cat > "$APP_DIR/.env" << 'ENVEOF'
            POSTGRES_DB=arkwallet
            POSTGRES_USER=arkwallet
            POSTGRES_PASSWORD=arkwallet_secure_pass_2024
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_ADMIN_ID=${{ secrets.TELEGRAM_ADMIN_ID }}
            TELEGRAM_ADMIN_ID_ADDITION=${{ secrets.TELEGRAM_ADMIN_ID_ADDITION }}
            TELEGRAM_ADMIN_ID_ADDITION_THIRD=${{ secrets.TELEGRAM_ADMIN_ID_ADDITION_THIRD }}
            RABBITMQ_USER=arkwallet
            RABBITMQ_PASSWORD=rabbit_secure_pass_2024
            ENVEOF
              echo "[!] Created .env from GitHub Secrets"
            fi

            # Build and restart
            docker compose build
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Reload nginx (if configured)
            nginx -t 2>/dev/null && systemctl reload nginx || true

            # Renew SSL cert if needed
            certbot renew --quiet 2>/dev/null || true

            echo "=== Deploy complete ==="
            echo "App: https://arkwallet.ru"
            echo "Swagger: https://arkwallet.ru/swagger"
            echo "RabbitMQ: https://arkwallet.ru:15672 (or http://${{ secrets.SERVER_HOST }}:15672)"
