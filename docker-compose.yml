services:
  postgres:
    image: postgres:16-alpine
    container_name: arkwallet-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arkwallet}
      POSTGRES_USER: ${POSTGRES_USER:-arkwallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arkwallet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: arkwallet-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/kiew-301/arkwallet:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkwallet-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      Database__Provider: "PostgreSQL"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-arkwallet};Username=${POSTGRES_USER:-arkwallet};Password=${POSTGRES_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Metrics__ApiKey: ${METRICS_API_KEY:-change-me-metrics-api-key}
      Telegram__BotToken__Main: ${TELEGRAM_BOT_TOKEN}
      Telegram__AdminId__Main: ${TELEGRAM_ADMIN_ID}
      Telegram__AdminId__Addition: ${TELEGRAM_ADMIN_ID_ADDITION}
      Telegram__AdminId__AdditionThird: ${TELEGRAM_ADMIN_ID_ADDITION_THIRD}
      Telegram__AllowedUserIds: ${TELEGRAM_ALLOWED_USER_IDS:-}
      Telegram__BaseUrl: ${TELEGRAM_BASE_URL:-}
      RabbitMQ__UserName: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMQ__HostName: rabbitmq
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: arkwallet-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.1.0
    container_name: arkwallet-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${METRICS_API_KEY:-change-me-metrics-api-key}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: arkwallet-node-exporter
    restart: always
    command:
      - "--path.rootfs=/rootfs"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
